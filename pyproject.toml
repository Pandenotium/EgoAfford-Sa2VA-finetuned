[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egoafford-benchmark"
version = "2.0.0.dev0"
description = "Sa2VA training, inference and fixed-role evaluation for EgoAfford"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.scripts]
egoafford = "egoafford.__main__:main"

[tool.setuptools.packages.find]
include = ["egoafford*"]

[tool.setuptools]
py-modules = ["batch_support"]
